name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases and tags
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for autorel
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Create release
        run: npx autorel@^2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
